name: Build VoiceDeck exe
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy sounddevice soundfile keyboard pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name VoiceDeck --collect-all sounddevice --collect-all soundfile --hidden-import scipy.signal voicedeck.py
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceDeck-exe
          path: dist/VoiceDeck.exe
